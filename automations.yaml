- id: sicherheit_pumpe_ohne_ventil_blockieren
  alias: "🛡️ Sicherheit: Pumpe ohne Ventil blockieren"
  mode: single
  trigger:
  - platform: state
    entity_id: switch.wsp_2_steckdose_1
    to: 'on'
  - platform: state
    entity_id:
    - switch.irrigation_valve_1
    - switch.irrigation_valve_2
    - switch.irrigation_valve_3
    - switch.irrigation_valve_4
    - switch.irrigation_valve_5
    to: 'off'
  condition:
  - condition: state
    entity_id: switch.wsp_2_steckdose_1
    state: 'on'
  - condition: template
    value_template: "{% set ventile = [\n  states('switch.irrigation_valve_1'),\n
      \ states('switch.irrigation_valve_2'),\n  states('switch.irrigation_valve_3'),\n
      \ states('switch.irrigation_valve_4'),\n  states('switch.irrigation_valve_5')\n]
      %} {{ 'on' not in ventile }}\n"
  action:
  - action: switch.turn_off
    target:
      entity_id: switch.wsp_2_steckdose_1
  - action: script.globale_benachrichtigung
    data:
      titel: "🛡️ Pumpen-Schutz"
      nachricht: Die Pumpe lief ohne offenes Ventil und wurde sofort blockiert!
- id: sicherheit_pumpen_watchdog_dynamisch
  alias: "🛡️ Sicherheit: Dynamischer Pumpen-Watchdog"
  mode: restart
  trigger:
  - platform: state
    entity_id: switch.wsp_2_steckdose_1
    to: 'on'
    for:
      minutes: "{% set ns = namespace(max_dauer=0) %} {% if is_state('switch.irrigation_valve_1',
        'on') %}\n  {% set ns.max_dauer = [ns.max_dauer, states('input_number.slot_1_impuls_dauer')
        | int(0)] | max %}\n{% endif %} {% if is_state('switch.irrigation_valve_2',
        'on') %}\n  {% set ns.max_dauer = [ns.max_dauer, states('input_number.slot_2_impuls_dauer')
        | int(0)] | max %}\n{% endif %} {% if is_state('switch.irrigation_valve_3',
        'on') %}\n  {% set ns.max_dauer = [ns.max_dauer, states('input_number.slot_3_impuls_dauer')
        | int(0)] | max %}\n{% endif %} {% if is_state('switch.irrigation_valve_4',
        'on') %}\n  {% set ns.max_dauer = [ns.max_dauer, states('input_number.slot_4_impuls_dauer')
        | int(0)] | max %}\n{% endif %} {% if is_state('switch.irrigation_valve_5',
        'on') %}\n  {% set ns.max_dauer = [ns.max_dauer, states('input_number.slot_5_impuls_dauer')
        | int(0)] | max %}\n{% endif %} {{ ns.max_dauer + 2 if ns.max_dauer > 0 else
        1 }}\n"
  action:
  - action: switch.turn_off
    target:
      entity_id: switch.wsp_2_steckdose_1
  - action: script.globale_benachrichtigung
    data:
      titel: "🚨 Watchdog Not-Aus!"
      nachricht: Die Pumpe lief ungewöhnlich lange und wurde per dynamischem Watchdog
        zwangsabgeschaltet!
- id: sicherheit_pumpe_aus_ventile_zu
  alias: "🛡️ Sicherheit: Pumpe AUS = Alle Ventile ZU"
  mode: single
  trigger:
  - platform: state
    entity_id: switch.wsp_2_steckdose_1
    to: 'off'
  action:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.irrigation_valve_1
      - switch.irrigation_valve_2
      - switch.irrigation_valve_3
      - switch.irrigation_valve_4
      - switch.irrigation_valve_5
