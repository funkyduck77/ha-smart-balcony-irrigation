- id: bewaesserung_slot_4
  alias: "💧 Bewässerung: Slot 4 (Hybrid)"
  mode: single
  max_exceeded: silent
  trigger:
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_4
    below: input_number.slot_4_feuchte_min
    for:
      minutes: 5
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_4
    below: input_number.slot_4_feuchte_notfall
    for:
      minutes: 5
  - platform: time
    at: input_datetime.slot_4_start_zeit
  - platform: time_pattern
    minutes: /15
  condition:
  - condition: state
    entity_id: input_boolean.pumpen_sperre
    state: 'off'
  - condition: template
    value_template: '{{ states(''sensor.gw1100a_soil_moisture_4'') | float(100) <
      states(''input_number.slot_4_feuchte_min'') | float(0) }}'
  - condition: template
    value_template: "{% if is_state('input_boolean.slot_4_untersetzer_modus', 'on')
      %}\n  {% set valve = states.switch.irrigation_valve_4 %}\n  {% set last_run
      = as_timestamp(valve.last_changed, 0) if valve else 0 %}\n  {% set not_cd =
      states('input_number.slot_4_sperrzeit_notfall_stunden') | float(1) * 3600 %}\n
      \ {{ (as_timestamp(now()) - last_run) > not_cd }}\n{% else %}\n  true\n{% endif
      %}\n"
  - or:
    - condition: numeric_state
      entity_id: sensor.gw1100a_soil_moisture_4
      below: input_number.slot_4_feuchte_notfall
    - and:
      - condition: time
        after: input_datetime.slot_4_start_zeit
        before: input_datetime.slot_4_ende_zeit
      - condition: template
        value_template: "{% if is_state('input_boolean.slot_4_untersetzer_modus',
          'on') %}\n  {% set valve = states.switch.irrigation_valve_4 %}\n  {% set
          last_run = as_timestamp(valve.last_changed, 0) if valve else 0 %}\n  {%
          set base_h = states('input_number.slot_4_sperrzeit_stunden') | float(36)
          %}\n  {% set temp = states('sensor.timmerflotte_temp_hmd_sensor_temperatur')
          | float(20) %}\n  {% set hitze_schwelle = states('input_number.sperrzeit_hitze_schwelle')
          | float(28.0) %}\n  {% set hitze_limit = states('input_number.sperrzeit_hitze_max_h')
          | float(24.0) %}\n  {% set final_h = hitze_limit if (temp >= hitze_schwelle
          and base_h > hitze_limit) else base_h %}\n  {{ (as_timestamp(now()) - last_run)
          > (final_h * 3600) }}\n{% else %}\n  true\n{% endif %}\n"
  action:
  - if:
    - condition: state
      entity_id: input_boolean.slot_4_untersetzer_modus
      state: 'on'
    then:
    - action: script.pumpe_puls
      data:
        slot: '4'
        notfall: '{{ states(''sensor.gw1100a_soil_moisture_4'') | float(100) < states(''input_number.slot_4_feuchte_notfall'')
          | float(0) }}'
    else:
    - repeat:
        sequence:
        - if:
          - condition: state
            entity_id: input_boolean.pumpen_sperre
            state: 'off'
          then:
          - action: script.pumpe_puls
            data:
              slot: '4'
              notfall: '{{ states(''sensor.gw1100a_soil_moisture_4'') | float(100)
                < states(''input_number.slot_4_feuchte_notfall'') | float(0) }}'
          - delay:
              minutes: '{{ states(''input_number.slot_4_sicker_pause'') | int(20)
                }}'
        until:
        - or:
          - condition: template
            value_template: '{{ states(''sensor.gw1100a_soil_moisture_4'') | float(0)
              > states(''input_number.slot_4_feuchte_max'') | float(100) }}'
          - condition: template
            value_template: '{{ repeat.index >= states(''input_number.maximale_giess_runden'')
              | int(5) }}'
