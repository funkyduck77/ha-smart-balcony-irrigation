- id: bewaesserung_restwasser_sync
  alias: "💧 Eingabefeld mit Restwasser synchronisieren"
  trigger:
  - platform: state
    entity_id: sensor.fass_restwasser
  action:
  - action: input_number.set_value
    target:
      entity_id: input_number.wasserverbrauch_korrektur
    data:
      value: '{{ states(''sensor.fass_restwasser'') | float(0) }}'
- id: bewaesserung_trockenlauf_strom
  alias: "💧 Bewässerung: Trockenlaufschutz Strommessung"
  trigger:
  - platform: numeric_state
    entity_id: sensor.wsp_2_leistung
    below: 150
    for:
      seconds: 5
  condition:
  - condition: state
    entity_id: switch.wsp_2_steckdose_1
    state: 'on'
  action:
  - action: switch.turn_off
    target:
      entity_id: switch.wsp_2_steckdose_1
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.pumpen_sperre
- id: bewaesserung_fuellstand_fass
  alias: "💧 Bewässerung: Füllstandschutz Fass"
  trigger:
  - platform: template
    value_template: >
      {% set rest = states('sensor.fass_restwasser') | float(100) %}
      {% set tot = states('input_number.fass_totvolumen') | float(0) %}
      {% set warn = states('input_number.fass_warnpuffer') | float(5.0) %}
      {{ rest <= (tot + warn) }}
    id: warnung
  - platform: template
    value_template: >
      {% set rest = states('sensor.fass_restwasser') | float(100) %}
      {% set tot = states('input_number.fass_totvolumen') | float(0) %}
      {{ rest <= tot }}
    id: stopp
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: warnung
      sequence:
      - action: script.globale_benachrichtigung
        data:
          titel: "🚨 Wasserstand niedrig"
          nachricht: Puffer im Fass ist erreicht, bitte nachfüllen.
    - conditions:
      - condition: trigger
        id: stopp
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.wsp_2_steckdose_1
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pumpen_sperre
      - action: script.globale_benachrichtigung
        data:
          titel: "🚨 FASS LEER"
          nachricht: Pumpe gestoppt. Fass leer, bitte auffüllen!
  mode: queued
- id: bewaesserung_telemetrie_trocken
  alias: "💧 Bewässerung: Warnung Erhöhter Durst"
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_1
    below: input_number.slot_1_feuchte_min
    for:
      minutes: 30
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_2
    below: input_number.slot_2_feuchte_min
    for:
      minutes: 30
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_3
    below: input_number.slot_3_feuchte_min
    for:
      minutes: 30
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_4
    below: input_number.slot_4_feuchte_min
    for:
      minutes: 30
  - platform: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_5
    below: input_number.slot_5_feuchte_min
    for:
      minutes: 30
  action:
  - action: script.globale_benachrichtigung
    data:
      titel: "🌵 Erhöhter Durst"
      nachricht: '{% set slot = trigger.entity_id[-1] %} {% set name = states(''input_text.slot_''
        ~ slot ~ ''_name'') %} {{ name }} meldet einen Wert von {{ trigger.to_state.state
        }}% (Dein eingestelltes Minimum liegt bei {{ states(trigger.below) }}%).'
  - delay: 01:00:00
- id: bewaesserung_telemetrie_staunaesse
  alias: "💧 Bewässerung: Warnung Staunässe"
  mode: single
  trigger:
  - platform: numeric_state
