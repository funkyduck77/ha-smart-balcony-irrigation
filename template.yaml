- trigger:
    - platform: event
      event_type: giess_event
  sensor:
    - name: "Gieß Historie"
      unique_id: giess_historie
      icon: mdi:history
      state: "{{ now().strftime('%d.%m. %H:%M') }}"
      attributes:
        letzte_runden: >
          {% set history = this.attributes.letzte_runden | default([]) %}
          {% set data = trigger.event.data %}
          {% if data.pflanze is defined %}
            {% set new_item = {
              'zeit': now().strftime('%d.%m. %H:%M:%S'),
              'pflanze': data.pflanze,
              'dauer': data.dauer,
              'fluss': data.fluss,
              'verbrauch': data.verbrauch,
              'type': data.type | default('A', true)
            } %}
            {{ ([new_item] + history)[:30] }} 
          {% else %}
            {{ history }}
          {% endif %}
