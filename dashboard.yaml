views:
  - title: Bewässerung
    cards:
      - type: vertical-stack
        cards:
          - type: vertical-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:fluid-level-background-card
                    entity: sensor.fass_restwasser
                    full_value: 60
                    level_color: rgba(74, 117, 160, 0.8)
                    card:
                      type: markdown
                      content: >
                        Wasserfass: {{ states('input_number.fass_volumen_max')
                        }} L

                        (Netto: {{ (states('input_number.fass_volumen_max') |
                        float(60) - states('input_number.fass_totvolumen') |
                        float(0)) | round(1) }} L)

                        Restwasser: {{ (states('sensor.fass_restwasser') |
                        float(60) - states('input_number.fass_totvolumen') |
                        float(0)) | round(1) }} L
                      card_mod:
                        style: |
                          ha-card {
                            background: transparent !important;
                            border: none !important;
                            box-shadow: inset 0px 0px 25px rgba(0,0,0,0.6) !important;
                            min-height: 220px !important;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                          }
                    card_mod:
                      style: |
                        :host {
                          display: block !important;
                          width: 220px !important;
                          margin: 15px auto 30px auto !important;
                          border-radius: 24px !important;
                          border: 3px solid rgba(150, 150, 150, 0.2) !important;
                          overflow: hidden !important;
                          box-shadow: 0px 6px 15px rgba(0,0,0,0.2) !important;
                          transform: translateZ(0);
                          -webkit-mask-image: -webkit-radial-gradient(white, black);
                          {% set status = states('sensor.fass_fullstand_status') %}
                          {% if status == 'leer' %}
                            filter: hue-rotate(150deg) saturate(300%) !important;
                          {% elif status == 'niedrig' %}
                            filter: hue-rotate(180deg) saturate(250%) !important;
                          {% endif %}
                        }
                  - type: markdown
                    content: >
                      ### Home Assistant Bewässerung

                      **Aktueller Pumpen-Status:**

                      ## {% if is_state('switch.wsp_2_steckdose_1', 'on') %} 💦
                      Gießt... {% else %} Aus {% endif %}

                      {% if is_state('switch.wsp_2_steckdose_1', 'on') %} {% set
                      event = states('input_text.aktuelles_giessevent') %} {% if
                      event in ['unknown', 'unavailable', ''] %} **Aktives
                      Event:** Manuell ausgelöst {% else %} **Aktives Event:**
                      {{ event }} {% endif %} {% endif %}

                      {% if is_state('input_boolean.pumpen_sperre', 'on') %} 🚨
                      **GESPERRT: Trockenlauf-Schutz aktiv!** {% else %} {% set
                      ns = namespace(probleme=[]) %} {% for i in range(1, 6) %}
                        {% set slot = i | string %}
                        {% set name = states('input_text.slot_' ~ slot ~ '_name') %}
                        {% set feuchte_str = states('sensor.gw1100a_soil_moisture_' ~ slot) %}
                        {% if feuchte_str not in ['unknown', 'unavailable', ''] %}
                          {% set feuchte = feuchte_str | float(100) %}
                          {% set min = states('input_number.slot_' ~ slot ~ '_feuchte_min') | float(0) %}
                          {% set max = states('input_number.slot_' ~ slot ~ '_feuchte_max') | float(100) %}
                          {% set notfall = states('input_number.slot_' ~ slot ~ '_feuchte_notfall') | float(0) %}
                          {% set u_modus = is_state('input_boolean.slot_' ~ slot ~ '_untersetzer_modus', 'on') %}

                          {% set err = [] %}
                          {% if feuchte < notfall %}
                            {% set err = err + ['🆘 Kritisch trocken (' ~ feuchte ~ '%)'] %}
                          {% elif feuchte < min %}
                            {% set err = err + ['🌵 Zu trocken (' ~ feuchte ~ '%)'] %}
                          {% elif not u_modus and feuchte > max %}
                            {% set err = err + ['💧 Zu nass (' ~ feuchte ~ '%)'] %}
                          {% endif %}

                          {% if err | length > 0 %}
                            {% set ns.probleme = ns.probleme + ['**' ~ name ~ '**: ' ~ err | join(', ')] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}


                      {% if ns.probleme | length > 0 %} 🚨 **Achtung,
                      Handlungsbedarf:**<br> {{ ns.probleme | join('<br>') }} {%
                      else %} ✅ **Boden & Pflanzen im optimalen Bereich.**
                      System bereit. {% endif %} {% endif %}

                      <br><b>Wassertank (nutzbar):</b><br><em>{{
                      (states('sensor.fass_restwasser') | float(60) -
                          states('input_number.fass_totvolumen') | float(0)) | round(1) }} L ({{states('sensor.fass_restwasser_prozent') }} %)</em>

                      <b>Status:</b> {% set status =
                      states('sensor.fass_fullstand_status')

                      %} {% if status == 'leer' %}
                        <font color="red">Kritisch: Pumpe gestoppt (Fass leer)</font>
                      {% elif status == 'niedrig' %}
                        <font color="orange">Warnung: Wasserstand niedrig</font>
                      {% else %}
                        <font color="green">Wasserstand ok</font>
                      {% endif %} 
