                name: Trockenlauf-Schutz
          - type: entities
            title: Logbuch
            show_header_toggle: false
            entities:
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: Letzte Gießvorgänge
                entities:
                  - type: custom:hui-markdown-card
                    content: >
                      | Datum | Pflanze | Dauer | L/h | Verbrauch | Art |

                      | :--- | :--- | :--- | :--- | :--- | :---: |

                      {% set runden = state_attr('sensor.giess_historie',
                      'letzte_runden') %}

                      {% if runden %}
                        {% for event in runden %}
                          {% set farbe = '#2196F3' if event.type == 'M' else '#FFC107' %}
                          {% set titletext = 'Manuell' if event.type == 'M' else 'Automatisch' %}
                      | {{ event.zeit }} | {{ event.pflanze }} | {{ (event.dauer
                      / 60) | round(1) }} min | {{ event.fluss | round(1) }} |
                      {{ event.verbrauch | round(2) }} L | **<font color="{{
                      farbe }}"><abbr title="{{ titletext }}">{{ event.type
                      }}</abbr></font>** |
                        {% endfor %}
                      {% else %}

                      | Keine Einträge vorhanden | | | | | |

                      {% endif %} 
